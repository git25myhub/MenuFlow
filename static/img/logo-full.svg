<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the background -->
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Metallic silver gradient for text -->
    <linearGradient id="metallicSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e8e8;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#c0c0c0;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#a8a8a8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#909090;stop-opacity:1" />
    </linearGradient>
    
    <!-- Blue sphere gradient -->
    <radialGradient id="sphereGradient" cx="40%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.9" />
      <stop offset="30%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="70%" style="stop-color:#1e3a8a;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0.6" />
    </radialGradient>
    
    <!-- 3D text shadow -->
    <filter id="textShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="1" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <!-- Glow effect for sphere -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="120" fill="url(#backgroundGradient)"/>
  
  <!-- Faceted Blue Sphere -->
  <g transform="translate(280, 20)">
    <!-- Main sphere with glow -->
    <circle cx="0" cy="0" r="45" fill="url(#sphereGradient)" filter="url(#glow)"/>
    
    <!-- Faceted highlights -->
    <path d="M-25,-15 L-15,-25 L-5,-20 L-10,-10 Z" fill="#87ceeb" opacity="0.6"/>
    <path d="M-15,-25 L-5,-20 L5,-25 L0,-35 Z" fill="#add8e6" opacity="0.5"/>
    <path d="M-5,-20 L5,-25 L15,-20 L10,-10 Z" fill="#b0e0e6" opacity="0.4"/>
    <path d="M5,-25 L15,-20 L25,-15 L20,-25 Z" fill="#87ceeb" opacity="0.3"/>
    
    <!-- Bottom highlights -->
    <path d="M-20,10 L-10,20 L0,15 L-5,5 Z" fill="#87ceeb" opacity="0.4"/>
    <path d="M-10,20 L0,15 L10,20 L5,10 Z" fill="#add8e6" opacity="0.3"/>
    <path d="M0,15 L10,20 L20,15 L15,5 Z" fill="#b0e0e6" opacity="0.2"/>
  </g>
  
  <!-- BlueSpace Text -->
  <text x="50" y="50" font-family="Arial, sans-serif" font-size="36" font-weight="bold" 
        fill="url(#metallicSilver)" filter="url(#textShadow)">
    BlueSpace
  </text>
  
  <!-- RESTAURANTS Text -->
  <text x="50" y="75" font-family="Arial, sans-serif" font-size="18" font-weight="bold" 
        fill="url(#metallicSilver)" filter="url(#textShadow)">
    RESTAURANTS
  </text>
  
  <!-- Website URL -->
  <text x="200" y="110" font-family="Arial, sans-serif" font-size="10" 
        fill="#ffffff" opacity="0.8">
    WWW.IYELENDRES
  </text>
</svg>
