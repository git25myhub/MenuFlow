{% extends 'base.html' %}
{% block content %}
<div class="container mt-5" style="max-width: 520px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h2 class="h4 mb-3">Enter Admin Panel Password</h2>
            <form method="POST">
                {{ form.hidden_tag() }}
                <div class="mb-3">
                    {{ form.password.label(class="form-label") }}
                    {{ form.password(class="form-control") }}
                    {% for error in form.password.errors %}
                        <div class="text-danger small mt-1">{{ error }}</div>
                    {% endfor %}
                </div>
                <button type="submit" class="btn btn-primary w-100">Enter</button>
            </form>
            <div class="mt-3 d-flex justify-content-between">
                <a href="{{ url_for('change_admin_panel_password') }}">Change password</a>
                <a href="{{ url_for('reset_admin_panel_password') }}">Forgot password?</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
