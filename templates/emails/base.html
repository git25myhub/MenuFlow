<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject or 'BlueSpace Restaurants' }}</title>
    <style>
        /* Container */
        .email-container {
            width: 100%;
            background-color: #f4f6f8;
            padding: 24px 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
                         Ubuntu, Cantarell, 'Helvetica Neue', 'Fira Sans', 'Droid Sans', Arial, sans-serif;
            color: #0f172a;
        }
        .email-card {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(2, 6, 23, 0.08);
        }
        /* Header */
        .email-header {
            background: linear-gradient(90deg, #0ea5e9, #2563eb);
            padding: 20px 24px;
            color: #ffffff;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .brand-logo {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        .brand-name {
            font-size: 18px;
            font-weight: 700;
        }
        /* Body */
        .email-body {
            padding: 24px;
        }
        h1 {
            margin: 0 0 12px;
            font-size: 20px;
            color: #0f172a;
        }
        p {
            margin: 0 0 12px;
            line-height: 1.6;
            color: #334155;
        }
        .code {
            display: inline-block;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e40af;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 20px;
            letter-spacing: 3px;
        }
        .button {
            display: inline-block;
            background: #2563eb;
            color: #ffffff !important;
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 8px;
            font-weight: 600;
            margin: 12px 0;
        }
        .muted {
            color: #64748b;
            font-size: 12px;
        }
        /* Footer */
        .email-footer {
            padding: 16px 24px 24px;
            color: #6b7280;
            font-size: 12px;
            text-align: center;
        }
    </style>
    {% block head %}{% endblock %}
    <meta name="color-scheme" content="light only">
    <meta name="supported-color-schemes" content="light only">
    <!-- Text fallback preview for some clients -->
    <!-- {{ preview or '' }} -->
    <!-- Plain text fallback included below -->
</head>
<body class="email-container">
    <div class="email-card">
        <div class="email-header">
            <div class="brand">
                <div class="brand-logo">BR</div>
                <div class="brand-name">BlueSpace Restaurants</div>
            </div>
        </div>
        <div class="email-body">
            {% block content %}{% endblock %}
            <p class="muted">If you did not request this, you can safely ignore this email.</p>
        </div>
        <div class="email-footer">
            <div>© {{ current_year }} BlueSpace Restaurants</div>
        </div>
    </div>
    <!-- Plain text fallback for clients that strip HTML -->
    <div style="display:none; white-space:pre; font-size:0; line-height:0">
        {% block text_fallback %}{% endblock %}
    </div>
</body>
</html>
