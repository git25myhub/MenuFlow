<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% block title %}Admin | QR Code Menu System{% endblock %}</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark mb-4">
      <div class="container-fluid">
        <a class="navbar-brand" href="/admin/dashboard">Admin Panel</a>
        <div>
          <a href="/admin/dashboard" class="btn btn-outline-light me-2"
            >Dashboard</a
          >
          <a href="{{ url_for('admin_help_info') }}" class="btn btn-info me-2"
            >Help Info</a
          >
          <a href="{{ url_for('admin_feedback') }}" class="btn btn-warning me-2"
            >Feedback</a
          >
          <a
            href="{{ url_for('admin_categories') }}"
            class="btn btn-secondary me-2"
            >Categories</a
          >
          <a
            href="{{ url_for('platform_settings') }}"
            class="btn btn-success me-2"
            >Platform Settings</a
          >
          <a
            href="{{ url_for('commission_settings') }}"
            class="btn btn-primary me-2"
            >Commission Settings</a
          >
          <a href="{{ url_for('commission_bills') }}" class="btn btn-info me-2"
            >Commission Bills</a
          >
          <a
            href="{{ url_for('commission_reports') }}"
            class="btn btn-warning me-2"
            >Commission Reports</a
          >
          <a
            href="{{ url_for('admin_notifications') }}"
            class="btn btn-info me-2"
            >Notifications</a
          >
          <a href="/logout" class="btn btn-danger">Logout</a>
        </div>
      </div>
    </nav>
    <main>{% block content %}{% endblock %}</main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}

  </body>
</html>
