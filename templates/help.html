{% extends 'admin_panel_base.html' %}
{% block admin_panel_content %}
<div class="container mt-4">
    <h2>Contact Support</h2>
    <div class="card">
        <div class="card-body">
            <p><strong>Email:</strong> {{ help_info.email if help_info else 'Not set' }}</p>
            <p><strong>Phone:</strong> {{ help_info.phone if help_info else 'Not set' }}</p>
            <p><strong>Other:</strong> {{ help_info.other if help_info and help_info.other else 'N/A' }}</p>
        </div>
    </div>
</div>
{% endblock %}
