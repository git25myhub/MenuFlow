<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ user.restaurant_name }}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Category Scroll CSS -->
    <link href="{{ url_for('static', filename='css/category-scroll.css') }}" rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        /* Add texture background to the body */
        body {
            background-image: url('https://www.transparenttextures.com/patterns/light-grey-terrazzo.png'); /* Example texture, replace with your desired URL */
            background-repeat: repeat;
            background-color: #f9f9f9; /* Fallback color */
            color: #333; /* Default text color for readability */
        }

        .card-img-top {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .welcome-header {
            background-color: #f8f9fa;
            padding: 2rem 0;
            margin-bottom: 2rem;
            text-align: center;
        }
        .welcome-header h1 {
            color: #333;
            margin-bottom: 0.5rem;
        }
        .welcome-subtitle {
            color: #666;
            font-size: 1.2rem;
        }
    </style>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
</head>
<body>
    <!-- Toast Container for Flash Messages -->
    <div aria-live="polite" aria-atomic="true" class="position-fixed p-3" style="z-index: 1080; top: 20px; left: 50%; transform: translateX(-50%); max-width: 90%;">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="toast align-items-center text-bg-{{ 'danger' if category == 'danger' else category }} border-0 mb-2" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="3000">
                        <div class="d-flex">
                            <div class="toast-body">
                                {{ message }}
                            </div>
                            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                        </div>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    {% block content %}{% endblock %}

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        var toastElList = [].slice.call(document.querySelectorAll('.toast'))
        toastElList.forEach(function (toastEl) {
          var toast = new bootstrap.Toast(toastEl)
          toast.show()
        })
      })
    </script>
</body>
</html>
